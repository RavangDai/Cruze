# Desktop / laptop profile — webcam, no real OBD or GPS.

camera:
  device_index: 0
  width: 1280
  height: 720
  fps: 30
  simulated: false

perception:
  backend: yolo
  # yolov8n-seg is ~1.5-2x yolov8n on CPU (~90-130 ms at 720p on a laptop);
  # lanes + light HSV add ~5 ms. The budget is advisory — over-budget frames
  # log at DEBUG and count in metrics, nothing is dropped.
  latency_budget_ms: 150.0

telemetry:
  simulated: true            # no OBD dongle on a laptop

maps:
  offline_only: false

voice:
  wake_backend: stub         # no mic array wired yet in Phase 1
  stt_backend: stub
  tts_backend: stub
  offline_mode: false

hmi:
  enabled: true

logging:
  level: DEBUG
  structured: false          # pretty output for dev
