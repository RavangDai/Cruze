<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRUZE</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- No external assets. A car has no network guarantee, and the plan view
       replaced the tile map that used to need one. -->
</head>
<body>

<header id="spine">
  <span class="wordmark">CRUZE</span>

  <!-- The pipeline is a real ordered sequence — data flows through these five
       stages in this order — so the order carries information. Each stage lights
       when it has produced something this second. -->
  <ol id="stages" aria-label="Pipeline stages">
    <li data-stage="capture">Capture</li>
    <li data-stage="pre">Pre</li>
    <li data-stage="nets">Nets</li>
    <li data-stage="fusion">Fusion</li>
    <li data-stage="plan">Plan</li>
  </ol>

  <span class="telemetry">
    <span><b id="cam-fps">--.-</b> fps</span>
    <span><b id="scene-hz">--.-</b> Hz</span>
    <span><b id="frame-age">---</b> ms</span>
    <span class="lamp" id="lamp-gps">GPS</span>
    <span class="lamp" id="lamp-obd">OBD</span>
    <span class="lamp" id="lamp-link">Link</span>
  </span>
</header>

<main id="stage" aria-label="Live camera with detection overlay">
  <canvas id="video"></canvas>
  <canvas id="overlay"></canvas>
  <p id="nosignal">Waiting for camera</p>
  <div id="edge-left" class="edge side" aria-hidden="true"></div>
  <div id="edge-right" class="edge side" aria-hidden="true"></div>
  <div id="edge-bottom" class="edge bottom" aria-hidden="true"></div>
</main>

<section id="cluster" aria-label="Instruments">

  <article class="cell plan-cell">
    <h2>Plan view</h2>
    <canvas id="bev" aria-label="Tracked objects from above"></canvas>
  </article>

  <article class="cell speed-cell">
    <h2>Speed</h2>
    <div class="value" id="ego-speed">--</div>
    <div class="foot">
      <span>mph</span>
      <span id="limit-block" class="limit">Max <b id="limit">--</b></span>
    </div>
  </article>

  <article class="cell">
    <h2>Lead</h2>
    <div class="value" id="lead-range">--</div>
    <div class="foot">
      <span id="lead-kind">no target</span>
      <span id="lead-closing"></span>
    </div>
  </article>

  <article class="cell">
    <h2>Target accel</h2>
    <div class="value" id="accel">--</div>
    <div class="foot">
      <span>m/s&sup2;</span>
      <span class="meter" aria-hidden="true"><i id="accel-meter"></i></span>
    </div>
  </article>

  <article class="cell">
    <h2>Target tyre angle</h2>
    <div class="value" id="steer">--</div>
    <div class="foot">
      <span>degrees</span>
      <span class="wheel" aria-hidden="true"><i id="wheel-mark"></i></span>
    </div>
  </article>

  <article class="cell">
    <h2>Road curvature</h2>
    <div class="value" id="curve">--</div>
    <div class="foot">
      <span>1/m</span>
      <span id="heading">---&deg;</span>
    </div>
  </article>

</section>

<footer id="log" aria-live="polite">
  <p class="quiet" id="voice-line">Cruze is watching the road.</p>
  <ul id="ticker"></ul>
</footer>

<script type="module" src="/static/app.js"></script>
</body>
</html>
