[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cruze"
version = "0.1.0"
description = "Vision-first AI co-pilot for the car dashboard"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.9",
    "ultralytics>=8.2",
    "scipy>=1.13",
]
telemetry = [
    "obd>=0.7",
    "pyserial>=3.5",
]
voice = [
    "faster-whisper>=1.0",
    "openwakeword>=0.6",
    "anthropic>=0.30",
]
dashboard = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
onnx = [
    "onnxruntime>=1.17",   # use onnxruntime-gpu instead for cuda/tensorrt providers
]
all = [
    "cruze[vision]",
    "cruze[telemetry]",
    "cruze[voice]",
    "cruze[dashboard]",
    "cruze[onnx]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",           # starlette TestClient; tests skip without it
]

[project.scripts]
cruze = "cruze.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the dashboard frontend — setuptools excludes non-Python files by
# default and webapp.py serves from <package>/web at runtime.
"cruze.hmi" = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.package-dir]
"" = "src"
